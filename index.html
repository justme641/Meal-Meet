<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>聊天室</title>
<style>
  :root { --bg:#f2f4f7; --panel:#fff; --list:#f7f8fa; --text:#222; --muted:#7a8394; --line:#e2e6ed;
          --bubble:#fff; --me:#dce8ff; --meline:#c4d7fb; --accent:#2f6fed; --ghost:#e4e8ef; --ghosttext:#333;
          --input:#fff; --inputline:#c8cfda; --quote:#eef1f6; }
  [data-theme="dark"] { --bg:#12151a; --panel:#1b1f27; --list:#161a21; --text:#e6e9ef; --muted:#8d97a8; --line:#2a303b;
          --bubble:#242a35; --me:#243a63; --meline:#2f4c82; --accent:#4c86ff; --ghost:#2a303b; --ghosttext:#dfe3ea;
          --input:#12151a; --inputline:#3a4252; --quote:#1d222b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }
  .center { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 10px 16px; background: var(--accent); color: #fff; }
  button.ghost { background: var(--ghost); color: var(--ghosttext); }
  input[type=text], select { font: inherit; padding: 10px 12px; border: 1px solid var(--inputline); border-radius: 8px; width: 100%; max-width: 320px; background: var(--input); color: var(--text); }
  form.col { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #chat { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: var(--panel); position: relative; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 17px; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tools button { padding: 6px 9px; font-size: 14px; }
  .sub { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
  #list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--list); }
  .msg { max-width: 82%; align-self: flex-start; }
  .msg.me { align-self: flex-end; }
  .meta { font-size: 12px; color: var(--muted); margin: 0 4px 2px; display: flex; gap: 8px; align-items: center; }
  .me .meta { justify-content: flex-end; }
  .rbtn { background: none; color: var(--muted); padding: 0 4px; font-size: 14px; border-radius: 4px; }
  .bubble { background: var(--bubble); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
  .me .bubble { background: var(--me); border-color: var(--meline); }
  .bubble img, .bubble video { max-width: 100%; max-height: 320px; border-radius: 8px; display: block; }
  .bubble a { color: var(--accent); }
  .quote { font-size: 12px; color: var(--muted); background: var(--quote); border-left: 3px solid var(--accent); border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; cursor: pointer; white-space: normal; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); background: var(--quote); border-radius: 999px; padding: 3px 12px; }
  .flash .bubble { outline: 2px solid var(--accent); }
  #typing { font-size: 12px; color: var(--muted); padding: 2px 14px; min-height: 20px; }
  #status { font-size: 12px; color: #c0392b; padding: 0 14px 4px; min-height: 16px; }
  #replyBar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; background: var(--quote); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #replyBar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #replyBar button { padding: 2px 8px; }
  form#sendForm { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); align-items: center; }
  form#sendForm input[type=text] { max-width: none; flex: 1; }
  #emojiBox { position: absolute; left: 10px; bottom: 62px; width: 280px; max-width: calc(100% - 20px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 5; }
  #emojiBox button { background: none; padding: 4px; font-size: 20px; border-radius: 6px; }
  #emojiBox button:hover { background: var(--ghost); }
</style>
</head>
<body>

<!-- 畫面 1：建立新房間 -->
<div id="home" class="center hidden">
  <h2>建立聊天室</h2>
  <form id="createForm" class="col">
    <input type="text" id="roomTitle" maxlength="30" placeholder="聊天室名稱（例如：週末聚餐）" autocomplete="off">
    <select id="roomDays">
      <option value="1">開放 1 天</option>
      <option value="3">開放 3 天</option>
      <option value="7" selected>開放 7 天</option>
      <option value="30">開放 30 天</option>
      <option value="0">不限時</option>
    </select>
    <button type="submit">建立新房間</button>
  </form>
  <p style="color:var(--muted);font-size:13px">建立後，把網址貼給朋友就能一起聊。</p>
</div>

<!-- 畫面 2：輸入名稱 -->
<div id="nameBox" class="center hidden">
  <h2>你的名稱是？</h2>
  <form id="nameForm" class="col">
    <input type="text" id="nameInput" maxlength="20" placeholder="輸入想顯示的名稱" autocomplete="off">
    <button type="submit">進入聊天室</button>
  </form>
</div>

<!-- 畫面 3：結束 / 找不到 -->
<div id="ended" class="center hidden">
  <h2 id="endedText">這個聊天室已結束</h2>
</div>

<!-- 畫面 4：聊天室 -->
<div id="chat" class="hidden">
  <header>
    <div class="top">
      <div class="title" id="roomName"></div>
      <div class="tools">
        <button class="ghost" id="copyBtn" title="複製邀請網址">📋</button>
        <button class="ghost" id="exportBtn" title="匯出對話">💾</button>
        <button class="ghost" id="renameBtn" title="改我的名稱">✏️</button>
        <button class="ghost" id="bellBtn" title="開啟通知">🔔</button>
        <button class="ghost" id="themeBtn" title="深色／淺色">🌙</button>
      </div>
    </div>
    <div class="sub">
      <span id="countdown"></span>
      <span id="online"></span>
      <span id="who"></span>
    </div>
  </header>
  <div id="list"></div>
  <div id="typing"></div>
  <div id="status"></div>
  <div id="replyBar" class="hidden"><span id="replyText"></span><button class="ghost" id="replyCancel" type="button">✕</button></div>
  <div id="emojiBox" class="hidden"></div>
  <form id="sendForm">
    <button type="button" class="ghost" id="fileBtn" title="傳送圖片或檔案">＋</button>
    <input type="file" id="fileInput" class="hidden">
    <button type="button" class="ghost" id="emojiBtn" title="表情符號">😊</button>
    <input type="text" id="msgInput" placeholder="輸入訊息…" autocomplete="off" maxlength="2000">
    <button type="submit">送出</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ 只需要改這三行 ============ */
const SUPABASE_URL = "https://sumbrbigoixdyaqqayll.supabase.co";
const SUPABASE_KEY = "sb_publishable_DTg89c32RlO8q1V0ukmJog__dGzTQrV";
const SHARE_BASE = "";   // 選填：搬到新網址後，填這裡（例如 "https://my-chat.pages.dev/"），「複製網址」就會用新網址
/* ======================================== */

const MAX_MB = 10;
const $ = id => document.getElementById(id);

function rand(n) {
  const a = new Uint8Array(n);
  crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(36).padStart(2, "0")).join("");
}
function validRoom(r) { return /^[A-Za-z0-9]{8,64}$/.test(r); }
function pad2(n) { return String(n).padStart(2, "0"); }
function fmtTime(s) {
  return new Date(s).toLocaleString("zh-TW", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function snippet(m) {
  return (m.content || (m.file_name ? "[檔案] " + m.file_name : "")).slice(0, 40);
}

const room = location.hash.slice(1);
const cid = (() => {
  let c = null;
  try { c = localStorage.getItem("chat_cid"); } catch (e) {}
  if (!c) { c = rand(12); try { localStorage.setItem("chat_cid", c); } catch (e) {} }
  return c;
})();
let myName = "";
try { myName = localStorage.getItem("chat_name") || ""; } catch (e) {}

let db, roomInfo, channel, pollTimer;
let baseTitle = "聊天室";
let lastId = 0;
let replyTo = null;
const seen = new Set();
const msgMap = new Map();
const typers = {};

/* ---------- 畫面切換 ---------- */
function show(id) {
  ["home", "nameBox", "ended", "chat"].forEach(x => $(x).classList.toggle("hidden", x !== id));
}
function showEnded(t) { $("endedText").textContent = t; show("ended"); }
function setStatus(t) { $("status").textContent = t || ""; }

/* ---------- 深色模式 ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
}
let theme = "light";
try { theme = localStorage.getItem("chat_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
applyTheme(theme);
$("themeBtn").onclick = () => {
  theme = theme === "dark" ? "light" : "dark";
  applyTheme(theme);
  try { localStorage.setItem("chat_theme", theme); } catch (e) {}
};

/* ---------- 初始化 ---------- */
async function init() {
  if (SUPABASE_URL.includes("貼上") || SUPABASE_KEY.includes("貼上")) {
    show("ended");
    $("endedText").textContent = "尚未完成設定：請在 index.html 最上方填入 Supabase 網址與金鑰。";
    return;
  }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  if (!validRoom(room)) { show("home"); return; }

  const { data, error } = await db.from("rooms").select("*").eq("room", room).maybeSingle();
  if (error) { showEnded("讀取聊天室失敗：" + error.message); return; }
  if (!data) { showEnded("找不到這個聊天室，請確認網址是否完整。"); return; }
  roomInfo = data;
  if (isExpired()) { showEnded("這個聊天室已結束。"); return; }
  if (!myName) { show("nameBox"); $("nameInput").focus(); return; }
  startChat();
}

window.addEventListener("hashchange", () => location.reload());

$("createForm").onsubmit = async e => {
  e.preventDefault();
  const title = $("roomTitle").value.trim() || "聊天室";
  const days = Number($("roomDays").value);
  const id = rand(12);
  const expires_at = days > 0 ? new Date(Date.now() + days * 86400000).toISOString() : null;
  const { error } = await db.from("rooms").insert({ room: id, title, expires_at });
  if (error) { alert("建立失敗：" + error.message); return; }
  location.hash = id;
};

$("nameForm").onsubmit = e => {
  e.preventDefault();
  const n = $("nameInput").value.trim();
  if (!n) return;
  myName = n;
  try { localStorage.setItem("chat_name", n); } catch (err) {}
  startChat();
};

/* ---------- 房間期限 ---------- */
function isExpired() { return roomInfo.expires_at && new Date(roomInfo.expires_at) <= new Date(); }

function updateCountdown() {
  const el = $("countdown");
  if (!roomInfo.expires_at) { el.textContent = "⏳ 不限時"; return; }
  const diff = new Date(roomInfo.expires_at) - Date.now();
  if (diff <= 0) { lockRoom(); return; }
  if (diff < 3600000) { el.textContent = "⏳ 剩餘不到 1 小時"; return; }
  const h = Math.floor(diff / 3600000);
  el.textContent = "⏳ 剩餘 " + Math.floor(h / 24) + "天:" + pad2(h % 24) + "小時";
}

function lockRoom() {
  clearInterval(pollTimer);
  if (channel) db.removeChannel(channel);
  showEnded("這個聊天室已到期結束。");
}

async function refreshRoom() {
  const { data } = await db.from("rooms").select("*").eq("room", room).maybeSingle();
  if (!data) return;
  roomInfo = data;
  baseTitle = data.title;
  $("roomName").textContent = data.title;
  if (document.hidden === false) document.title = data.title;
  updateCountdown();
}

function updateWho() { $("who").textContent = "你是：" + myName; }

/* ---------- 開始聊天 ---------- */
async function startChat() {
  show("chat");
  baseTitle = roomInfo.title;
  document.title = baseTitle;
  $("roomName").textContent = baseTitle;
  updateWho();
  updateCountdown();
  setInterval(updateCountdown, 30000);
  setInterval(refreshRoom, 60000);

  const { data, error } = await db.from("messages").select("*")
    .eq("room", room).order("id", { ascending: false }).limit(500);
  if (error) setStatus("讀取失敗：" + error.message);
  else {
    data.reverse().forEach(m => addMsg(m, false));
    $("list").scrollTop = $("list").scrollHeight;
  }

  channel = db.channel("room-" + room, { config: { presence: { key: cid } } })
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: "room=eq." + room },
      p => addMsg(p.new, true))
    .on("presence", { event: "sync" }, updatePresence)
    .on("broadcast", { event: "typing" }, ({ payload }) => {
      if (payload && payload.cid !== cid) { typers[payload.cid] = { name: payload.name, t: Date.now() }; renderTyping(); }
    })
    .subscribe(async status => {
      if (status === "SUBSCRIBED") await channel.track({ name: myName });
    });

  pollTimer = setInterval(async () => {
    if (document.hidden) return;
    const { data } = await db.from("messages").select("*")
      .eq("room", room).gt("id", lastId).order("id", { ascending: true });
    if (data) data.forEach(m => addMsg(m, true));
  }, 5000);
}

/* ---------- 上線人數 / 輸入中 ---------- */
function updatePresence() {
  const names = [];
  Object.values(channel.presenceState()).forEach(arr => { if (arr[0] && arr[0].name) names.push(arr[0].name); });
  $("online").textContent = "👥 " + names.length + " 人在線：" + names.join("、");
}
function renderTyping() {
  const now = Date.now(), names = [];
  for (const k in typers) {
    if (now - typers[k].t < 3500) names.push(typers[k].name); else delete typers[k];
  }
  $("typing").textContent = names.length ? names.join("、") + " 正在輸入…" : "";
}
setInterval(renderTyping, 1000);

let lastTypingSent = 0;
$("msgInput").addEventListener("input", () => {
  const now = Date.now();
  if (channel && now - lastTypingSent > 2000) {
    lastTypingSent = now;
    channel.send({ type: "broadcast", event: "typing", payload: { cid, name: myName } });
  }
});

/* ---------- 顯示訊息 ---------- */
function isMine(m) { return m.client_id ? m.client_id === cid : m.name === myName; }

function addMsg(m, live) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  msgMap.set(m.id, m);
  lastId = Math.max(lastId, m.id);

  const list = $("list");
  const near = list.scrollHeight - list.scrollTop - list.clientHeight < 120;

  if (m.kind === "system") {
    const d = document.createElement("div");
    d.className = "sys"; d.id = "m" + m.id;
    d.textContent = m.content;
    list.appendChild(d);
  } else {
    const mine = isMine(m);
    const wrap = document.createElement("div");
    wrap.className = "msg" + (mine ? " me" : "");
    wrap.id = "m" + m.id;

    const meta = document.createElement("div");
    meta.className = "meta";
    const who = document.createElement("span");
    who.textContent = m.name + "　" + fmtTime(m.created_at);
    const rb = document.createElement("button");
    rb.type = "button"; rb.className = "rbtn"; rb.textContent = "↩"; rb.title = "回覆";
    rb.onclick = () => setReply(m);
    meta.appendChild(who); meta.appendChild(rb);

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (m.reply_to) {
      const o = msgMap.get(m.reply_to);
      const q = document.createElement("div");
      q.className = "quote";
      q.textContent = o ? "↩ " + o.name + "：" + snippet(o) : "↩ （較早的訊息）";
      q.onclick = () => {
        const t = document.getElementById("m" + m.reply_to);
        if (t) { t.scrollIntoView({ block: "center", behavior: "smooth" }); t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1500); }
      };
      bubble.appendChild(q);
    }

    if (m.content) bubble.appendChild(document.createTextNode(m.content));

    if (m.file_url && /^https:\/\//.test(m.file_url)) {
      if (m.content) bubble.appendChild(document.createElement("br"));
      const type = m.file_type || "";
      if (type.startsWith("image/")) {
        const a = document.createElement("a");
        a.href = m.file_url; a.target = "_blank"; a.rel = "noopener";
        const img = document.createElement("img");
        img.src = m.file_url; img.alt = m.file_name || "圖片"; img.loading = "lazy";
        a.appendChild(img); bubble.appendChild(a);
      } else if (type.startsWith("video/")) {
        const v = document.createElement("video");
        v.src = m.file_url; v.controls = true; v.preload = "metadata";
        bubble.appendChild(v);
      } else if (type.startsWith("audio/")) {
        const au = document.createElement("audio");
        au.src = m.file_url; au.controls = true;
        bubble.appendChild(au);
      } else {
        const a = document.createElement("a");
        a.href = m.file_url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "📎 " + (m.file_name || "下載檔案");
        bubble.appendChild(a);
      }
    }

    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    list.appendChild(wrap);
    if (live && !mine) notify(m);
  }

  if (near || isMine(m)) list.scrollTop = list.scrollHeight;
}

/* ---------- 新訊息通知 ---------- */
let unread = 0, flashTimer = null;
function notify(m) {
  if (!document.hidden) return;
  unread++;
  if (!flashTimer) {
    let on = false;
    flashTimer = setInterval(() => {
      on = !on;
      document.title = on ? "💬 (" + unread + ") 新訊息" : baseTitle;
    }, 1000);
  }
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification(baseTitle, { body: m.name + "：" + snippet(m), tag: "chat-" + room }); } catch (e) {}
  }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    unread = 0;
    clearInterval(flashTimer); flashTimer = null;
    if (roomInfo) document.title = baseTitle;
  }
});
$("bellBtn").onclick = async () => {
  if (!("Notification" in window)) { alert("這個瀏覽器不支援跳出通知，但分頁標題仍會閃動提醒。"); return; }
  if (Notification.permission === "granted") { alert("通知已經開啟了。"); return; }
  if (Notification.permission === "denied") { alert("通知被瀏覽器封鎖了。請按網址列左側的圖示，把「通知」改成允許，再重新整理。"); return; }
  const p = await Notification.requestPermission();
  alert(p === "granted" ? "通知已開啟！" : "沒有開啟通知。");
};

/* ---------- 送出訊息 ---------- */
async function insertMsg(row) {
  const payload = { room, name: myName, client_id: cid, ...row };
  if (row.kind !== "system" && replyTo) payload.reply_to = replyTo.id;
  const { data, error } = await db.from("messages").insert(payload).select().single();
  if (error) { setStatus("送出失敗：" + error.message); return; }
  setStatus("");
  if (payload.reply_to) clearReply();
  addMsg(data, false);
}

$("sendForm").onsubmit = async e => {
  e.preventDefault();
  const t = $("msgInput").value.trim();
  if (!t) return;
  $("msgInput").value = "";
  await insertMsg({ content: t });
};

/* ---------- 回覆 ---------- */
function setReply(m) {
  replyTo = { id: m.id };
  $("replyText").textContent = "回覆 " + m.name + "：" + snippet(m);
  $("replyBar").classList.remove("hidden");
  $("msgInput").focus();
}
function clearReply() { replyTo = null; $("replyBar").classList.add("hidden"); }
$("replyCancel").onclick = clearReply;

/* ---------- 檔案 ---------- */
async function sendFile(file) {
  if (file.size > MAX_MB * 1024 * 1024) { setStatus("檔案超過 " + MAX_MB + "MB，無法上傳"); return; }
  setStatus("上傳中…");
  const ext = ((file.name.split(".").pop() || "bin").replace(/[^A-Za-z0-9]/g, "").slice(0, 8)) || "bin";
  const path = room + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  const { error } = await db.storage.from("chat-files").upload(path, file, {
    contentType: file.type || "application/octet-stream"
  });
  if (error) { setStatus("上傳失敗：" + error.message); return; }
  const { data } = db.storage.from("chat-files").getPublicUrl(path);
  await insertMsg({ file_url: data.publicUrl, file_name: file.name, file_type: file.type || "" });
}
$("fileBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) await sendFile(f);
};
$("msgInput").addEventListener("paste", async e => {
  const files = e.clipboardData && e.clipboardData.files;
  if (files && files.length) { e.preventDefault(); await sendFile(files[0]); }
});

/* ---------- 表情符號 ---------- */
const EMOJIS = "😀 😃 😄 😁 😆 😂 🤣 😊 🙂 😉 😍 🥰 😘 😎 🤔 😅 😭 😢 😡 😴 🥳 🤗 🙄 😱 👍 👎 👏 🙏 💪 🙌 👌 ✌️ 🤝 ❤️ 💔 🔥 ✨ 🎉 🎂 🍻 🍜 🍔 ☕ 🌧️ ☀️ 🌙 💯 ✅ ❌ ❓ ❗".split(" ");
EMOJIS.forEach(em => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = em;
  b.onclick = () => {
    const el = $("msgInput");
    const s = el.selectionStart != null ? el.selectionStart : el.value.length;
    const e2 = el.selectionEnd != null ? el.selectionEnd : s;
    el.value = el.value.slice(0, s) + em + el.value.slice(e2);
    const p = s + em.length;
    el.setSelectionRange(p, p);
    el.focus();
  };
  $("emojiBox").appendChild(b);
});
$("emojiBtn").onclick = e => { e.stopPropagation(); $("emojiBox").classList.toggle("hidden"); };
document.addEventListener("click", e => {
  if (!$("emojiBox").contains(e.target)) $("emojiBox").classList.add("hidden");
});

/* ---------- 改名（會通知所有人） ---------- */
$("renameBtn").onclick = async () => {
  const n = prompt("新的名稱（最多 20 字）：", myName);
  if (!n) return;
  const nn = n.trim().slice(0, 20);
  if (!nn || nn === myName) return;
  const old = myName;
  myName = nn;
  try { localStorage.setItem("chat_name", nn); } catch (e) {}
  updateWho();
  if (channel) channel.track({ name: nn });
  await insertMsg({ kind: "system", content: old + " 改名為 " + nn });
};

/* ---------- 複製網址 / 匯出 ---------- */
$("copyBtn").onclick = async () => {
  const base = SHARE_BASE || (location.origin + location.pathname);
  const url = base.split("#")[0] + "#" + room;
  try { await navigator.clipboard.writeText(url); alert("已複製，貼到 LINE 給朋友即可"); }
  catch (e) { prompt("請手動複製這個網址：", url); }
};

$("exportBtn").onclick = async () => {
  setStatus("整理中…");
  let all = [], from = 0;
  while (true) {
    const { data, error } = await db.from("messages").select("*")
      .eq("room", room).order("id", { ascending: true }).range(from, from + 999);
    if (error) { setStatus("匯出失敗：" + error.message); return; }
    all = all.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  const byId = new Map(all.map(m => [m.id, m]));
  const lines = all.map(m => {
    const t = new Date(m.created_at).toLocaleString("zh-TW", { hour12: false });
    if (m.kind === "system") return "[" + t + "] ※ " + m.content;
    let s = "[" + t + "] " + m.name + "：";
    if (m.reply_to && byId.get(m.reply_to)) s += "(回覆 " + byId.get(m.reply_to).name + "：" + snippet(byId.get(m.reply_to)) + ") ";
    s += (m.content || "");
    if (m.file_url) s += " (檔案：" + (m.file_name || "") + " " + m.file_url + ")";
    return s;
  });
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (roomInfo.title || "聊天室") + "-" + new Date().toISOString().slice(0, 10) + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus("");
};

init();
</script>
