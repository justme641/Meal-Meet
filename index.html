<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朋友聊天室</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #f2f4f7; color: #222; }
  .hidden { display: none !important; }
  .center { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 10px 16px; background: #2f6fed; color: #fff; }
  button.ghost { background: #e4e8ef; color: #333; }
  input[type=text] { font: inherit; padding: 10px 12px; border: 1px solid #c8cfda; border-radius: 8px; width: 100%; max-width: 320px; }
  #chat { height: 100%; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: #fff; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #e2e6ed; flex-wrap: wrap; }
  header .title { font-weight: 600; }
  header .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  header button { padding: 6px 10px; font-size: 14px; }
  #list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #f7f8fa; }
  .msg { max-width: 80%; align-self: flex-start; }
  .msg.me { align-self: flex-end; }
  .meta { font-size: 12px; color: #7a8394; margin: 0 4px 2px; }
  .me .meta { text-align: right; }
  .bubble { background: #fff; border: 1px solid #e2e6ed; border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
  .me .bubble { background: #dce8ff; border-color: #c4d7fb; }
  .bubble img, .bubble video { max-width: 100%; max-height: 320px; border-radius: 8px; display: block; }
  .bubble a { color: #2f6fed; }
  form#sendForm { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e2e6ed; align-items: center; }
  form#sendForm input[type=text] { max-width: none; flex: 1; }
  #status { font-size: 12px; color: #c0392b; padding: 0 12px 6px; min-height: 18px; }
</style>
</head>
<body>

<!-- 畫面 1：沒有房間網址時，建立新房間 -->
<div id="home" class="center hidden">
  <h2>朋友聊天室</h2>
  <p>按下按鈕建立一個新房間，<br>再把網址貼給朋友就能一起聊。</p>
  <button id="createBtn">建立新房間</button>
</div>

<!-- 畫面 2：輸入名稱 -->
<div id="nameBox" class="center hidden">
  <h2>你的名稱是？</h2>
  <form id="nameForm" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
    <input type="text" id="nameInput" maxlength="20" placeholder="輸入想顯示的名稱" autocomplete="off">
    <button type="submit">進入聊天室</button>
  </form>
</div>

<!-- 畫面 3：聊天室 -->
<div id="chat" class="hidden">
  <header>
    <div class="title">聊天室　<span id="who" style="font-weight:400;color:#7a8394"></span></div>
    <div class="tools">
      <button class="ghost" id="copyBtn">複製邀請網址</button>
      <button class="ghost" id="exportBtn">匯出對話</button>
      <button class="ghost" id="renameBtn">改名稱</button>
    </div>
  </header>
  <div id="list"></div>
  <div id="status"></div>
  <form id="sendForm">
    <button type="button" class="ghost" id="fileBtn" title="傳送圖片或檔案">＋</button>
    <input type="file" id="fileInput" class="hidden">
    <input type="text" id="msgInput" placeholder="輸入訊息…" autocomplete="off" maxlength="2000">
    <button type="submit">送出</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ 只需要改這兩行 ============ */
const SUPABASE_URL = "https://sumbrbigoixdyaqqayll.supabase.co";
const SUPABASE_KEY = "sb_publishable_DTg89c32RlO8q1V0ukmJog__dGzTQrV";
/* ======================================== */

const MAX_MB = 10;
const $ = id => document.getElementById(id);
const room = location.hash.slice(1);
let myName = localStorage.getItem("chat_name") || "";
const seen = new Set();
let lastId = 0;
let db;

function show(id) {
  ["home", "nameBox", "chat"].forEach(x => $(x).classList.toggle("hidden", x !== id));
}
function setStatus(t) { $("status").textContent = t || ""; }
function validRoom(r) { return /^[A-Za-z0-9]{8,64}$/.test(r); }
function randomRoom() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(36).padStart(2, "0")).join("").slice(0, 24);
}
function fmtTime(s) {
  return new Date(s).toLocaleString("zh-TW", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function init() {
  if (SUPABASE_URL.includes("貼上") || SUPABASE_KEY.includes("貼上")) {
    show("home");
    $("home").innerHTML = "<h2>尚未完成設定</h2><p>請先在 index.html 最上方填入 Supabase 的網址與金鑰。</p>";
    return;
  }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  if (!validRoom(room)) { show("home"); return; }
  if (!myName) { show("nameBox"); $("nameInput").focus(); return; }
  startChat();
}

$("createBtn").onclick = () => { location.hash = randomRoom(); location.reload(); };
window.addEventListener("hashchange", () => location.reload());

$("nameForm").onsubmit = e => {
  e.preventDefault();
  const n = $("nameInput").value.trim();
  if (!n) return;
  myName = n;
  localStorage.setItem("chat_name", n);
  init();
};
$("renameBtn").onclick = () => {
  const n = prompt("新的名稱：", myName);
  if (n && n.trim()) {
    myName = n.trim().slice(0, 20);
    localStorage.setItem("chat_name", myName);
    $("who").textContent = "（你是 " + myName + "）";
  }
};

function addMsg(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  lastId = Math.max(lastId, m.id);

  const list = $("list");
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;

  const wrap = document.createElement("div");
  wrap.className = "msg" + (m.name === myName ? " me" : "");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = m.name + "　" + fmtTime(m.created_at);
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (m.content) bubble.appendChild(document.createTextNode(m.content));

  if (m.file_url && /^https:\/\//.test(m.file_url)) {
    if (m.content) bubble.appendChild(document.createElement("br"));
    const type = m.file_type || "";
    if (type.startsWith("image/")) {
      const a = document.createElement("a");
      a.href = m.file_url; a.target = "_blank"; a.rel = "noopener";
      const img = document.createElement("img");
      img.src = m.file_url; img.alt = m.file_name || "圖片"; img.loading = "lazy";
      a.appendChild(img); bubble.appendChild(a);
    } else if (type.startsWith("video/")) {
      const v = document.createElement("video");
      v.src = m.file_url; v.controls = true; v.preload = "metadata";
      bubble.appendChild(v);
    } else if (type.startsWith("audio/")) {
      const au = document.createElement("audio");
      au.src = m.file_url; au.controls = true;
      bubble.appendChild(au);
    } else {
      const a = document.createElement("a");
      a.href = m.file_url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "📎 " + (m.file_name || "下載檔案");
      bubble.appendChild(a);
    }
  }

  wrap.appendChild(meta);
  wrap.appendChild(bubble);
  list.appendChild(wrap);
  if (nearBottom || m.name === myName) list.scrollTop = list.scrollHeight;
}

async function startChat() {
  show("chat");
  $("who").textContent = "（你是 " + myName + "）";

  const { data, error } = await db.from("messages").select("*")
    .eq("room", room).order("id", { ascending: true }).limit(500);
  if (error) { setStatus("讀取失敗：" + error.message); }
  else { data.forEach(addMsg); $("list").scrollTop = $("list").scrollHeight; }

  // 即時推送
  db.channel("room-" + room)
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: "room=eq." + room },
      p => addMsg(p.new))
    .subscribe();

  // 備援：每 5 秒檢查一次有沒有漏掉的新訊息
  setInterval(async () => {
    if (document.hidden) return;
    const { data } = await db.from("messages").select("*")
      .eq("room", room).gt("id", lastId).order("id", { ascending: true });
    if (data) data.forEach(addMsg);
  }, 5000);
}

async function insertMsg(row) {
  const { data, error } = await db.from("messages")
    .insert({ room, name: myName, ...row }).select().single();
  if (error) { setStatus("送出失敗：" + error.message); return; }
  setStatus("");
  addMsg(data);
}

$("sendForm").onsubmit = async e => {
  e.preventDefault();
  const t = $("msgInput").value.trim();
  if (!t) return;
  $("msgInput").value = "";
  await insertMsg({ content: t });
};

async function sendFile(file) {
  if (file.size > MAX_MB * 1024 * 1024) { setStatus("檔案超過 " + MAX_MB + "MB，無法上傳"); return; }
  setStatus("上傳中…");
  const ext = ((file.name.split(".").pop() || "bin").replace(/[^A-Za-z0-9]/g, "").slice(0, 8)) || "bin";
  const path = room + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  const { error } = await db.storage.from("chat-files").upload(path, file, {
    contentType: file.type || "application/octet-stream"
  });
  if (error) { setStatus("上傳失敗：" + error.message); return; }
  const { data } = db.storage.from("chat-files").getPublicUrl(path);
  await insertMsg({ file_url: data.publicUrl, file_name: file.name, file_type: file.type || "" });
}

$("fileBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) await sendFile(f);
};
// 直接貼上截圖也能傳
$("msgInput").addEventListener("paste", async e => {
  const items = e.clipboardData && e.clipboardData.files;
  if (items && items.length) { e.preventDefault(); await sendFile(items[0]); }
});

$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); setStatus(""); alert("已複製，貼到 LINE 給朋友即可"); }
  catch { prompt("請手動複製這個網址：", location.href); }
};

$("exportBtn").onclick = async () => {
  setStatus("整理中…");
  const { data, error } = await db.from("messages").select("*")
    .eq("room", room).order("id", { ascending: true });
  if (error) { setStatus("匯出失敗：" + error.message); return; }
  const lines = data.map(m => {
    const t = new Date(m.created_at).toLocaleString("zh-TW", { hour12: false });
    let s = "[" + t + "] " + m.name + "：" + (m.content || "");
    if (m.file_url) s += " (檔案：" + (m.file_name || "") + " " + m.file_url + ")";
    return s;
  });
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "聊天紀錄-" + new Date().toISOString().slice(0, 10) + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus("");
};

init();
</script>
</body>
</html>
